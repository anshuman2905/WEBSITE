<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predict Your Yield</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(to bottom right, #a5d956, #4da2ca);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 20px;
      color: #065f46;
      opacity: 0;
      transform: translateY(-20px);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.5s;
    }

    h2 {
      font-size: 1.5rem;
      color: #1e3a8a;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(-20px);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 1.5s;
    }

    .card-container {
      display: flex;
      gap: 40px;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards;
      animation-delay: 2.5s;
    }

    .card {
      width: 200px;
      height: 260px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: transform 0.5s ease, box-shadow 0.3s ease;
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .card:hover {
      transform: rotateY(15deg) rotateX(10deg) scale(1.05);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .card img {
      width: 100%;
      height: 70%;
      object-fit: cover;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .card p {
      font-size: 1.2rem;
      font-weight: bold;
      color: #1e3a8a;
      margin: 15px 0;
    }

    /* Floating animation */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .card {
      animation: float 3s ease-in-out infinite;
    }

    /* Fade-in animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>🌾 Let's Predict Your Yield</h1>
  <h2>Select Your Crop</h2>

  <div class="card-container">
    <!-- Rice card -->
    <div class="card" onclick="window.location.href='rice_game.html'">
      <img src="./assets/images/rice.jpg" alt="Rice">
      <p>Rice</p>
    </div>

    
    <div class="card" onclick="window.location.href='wheat.html'">
      <img src="./assets/images/wheat.jpg" alt="Wheat">
      <p>Wheat</p>
    </div>
  </div>

</body>
</html>
